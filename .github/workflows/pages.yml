name: Deploy sito su GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Mucho8s_clean/frontend

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installa dipendenze
        run: npm ci --legacy-peer-deps

      - name: Verifica permessi e privacy
        run: node --test ../supabase/tests/*.cjs

      - name: Verifica Ranked, analytics e simulazioni
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Prepara animazione Rive rank-up (opzionale)
        run: |
          mkdir -p public/animations
          file="public/animations/game-badge-upgrade.riv"
          if curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 8 --max-time 35 \
            "https://public.rive.app/community/runtime-files/11488-21971-game-badge-upgrade-animation.riv" \
            --output "$file" && [ "$(head -c 4 "$file")" = "RIVE" ]; then
            echo "Animazione Rive caricata"
          else
            rm -f "$file"
            echo "::warning::Animazione Rive non disponibile. Proseguo con la grafica di fallback."
          fi

      - name: Compila sito
        run: npm run build
        env:
          CI: false
          REACT_APP_SUPABASE_URL: https://qddhlwixlarygncwabuv.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: sb_publishable_JAKhI0H5vNZxhgOkeW2wPw_5wWYVs6E

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: Mucho8s_clean/frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
